set dtb_name="@DTB_NAME@"
set partition_misc="(hd0,gpt11)"

# Note: Command `loadstring` is not available in upstream grub source code
loadstring $partition_misc android_misc 20 0
if [ "$android_misc" = "boot-recovery" ]; then
	# Boot to recovery
	set default=1
	set timeout=10
elif [ "$android_misc" = "bootonce-bootloader" ]; then
	# Do nothing
	true
else
	# Normal boot
	set default=0
	set timeout=10
fi

if insmod efi_gop; then
	terminal_output gfxterm
	loadfont /boot/grub/fonts/unicode.pf2
	insmod gfxmenu
fi

menuentry "Android" {
	echo 'Loading kernel...'
	linux /kernel @STRIPPED_BOARD_KERNEL_CMDLINE@
	echo 'Loading devicetree...'
	devicetree /${dtb_name}
	echo 'Loading ramdisk...'
	initrd /ramdisk.img
}

menuentry "Android Recovery" {
	echo 'Loading kernel...'
	linux /kernel @STRIPPED_BOARD_KERNEL_CMDLINE@
	echo 'Loading devicetree...'
	devicetree /${dtb_name}
	echo 'Loading recovery ramdisk...'
	initrd /ramdisk-recovery.img
}

menuentry "Android Charger" {
	echo 'Loading kernel...'
	linux /kernel @STRIPPED_BOARD_KERNEL_CMDLINE@ androidboot.mode=charger
	echo 'Loading devicetree...'
	devicetree /${dtb_name}
	echo 'Loading ramdisk...'
	initrd /ramdisk.img
}

menuentry "Reboot" {
	reboot
}

menuentry "Exit" {
	exit
}
